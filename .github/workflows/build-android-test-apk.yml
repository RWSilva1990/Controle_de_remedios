name: Build RWS Remedios Android Native Test APK

on:
  push:
    branches:
      - feature/rws-remedios-redesign-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --package-lock=false

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npm run android:add

      - name: Sync Capacitor
        run: npm run android:sync

      - name: Verify alarm permissions
        run: |
          grep -q 'android.permission.SCHEDULE_EXACT_ALARM' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.USE_FULL_SCREEN_INTENT' android/app/src/main/AndroidManifest.xml
          grep -q '.RwsAlarmActivity' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RWS-Remedios-Alarme-Teste.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RWS-Remedios-Alarme-Teste
          path: RWS-Remedios-Alarme-Teste.apk
          if-no-files-found: error
